<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Lovett Entertainment | Atlanta Event DJ</title>
  <meta name="description" content="DJ Lovett Entertainment — Atlanta DJ for weddings, private events, and corporate events. Call/Text 404-403-5484." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#05060a;
      --panel: rgba(10,10,16,.62);
      --panel2: rgba(255,255,255,.04);
      --text:#fff;
      --muted: rgba(255,255,255,.72);
      --line: rgba(255,255,255,.10);
      --shadow: 0 18px 70px rgba(0,0,0,.55);

      --red:#ff3b3b;
      --blue:#2563eb;
      --violet:#a855f7;

      --max: 1120px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
      background:
        radial-gradient(900px 600px at 15% 0%, rgba(37,99,235,.14), transparent 60%),
        radial-gradient(900px 600px at 85% 10%, rgba(168,85,247,.10), transparent 55%),
        radial-gradient(900px 600px at 50% 120%, rgba(255,59,59,.08), transparent 55%),
        var(--bg);
      color:var(--text);
    }
    a{color:inherit;text-decoration:none}
    .container{width:min(var(--max),92vw);margin:0 auto}
    .anchor{scroll-margin-top:92px}

    /* NAV */
    .navwrap{
      position:fixed;top:0;left:0;right:0;z-index:50;
      background: linear-gradient(to bottom, rgba(0,0,0,.72), rgba(0,0,0,.22));
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .nav{
      padding:12px 0;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
    }
    .brand{
      display:flex;align-items:center;gap:10px;
      font-weight:900;letter-spacing:.2px;white-space:nowrap;
    }
    .mark{
      width:34px;height:34px;border-radius:12px;
      background: linear-gradient(135deg,var(--blue),var(--violet));
      border:1px solid rgba(255,255,255,.18);
      box-shadow: 0 14px 40px rgba(0,0,0,.45);
    }

    .links{display:flex;gap:10px;flex-wrap:wrap;font-weight:800;color:rgba(255,255,255,.9)}
    .links a{
      padding:8px 10px;border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
    }
    .links a:hover{background:rgba(0,0,0,.32)}
    @media (max-width: 820px){ .links{display:none} }
